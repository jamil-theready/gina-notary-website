name: Daily Blog

on:
  # Multi-fire on purpose. GitHub's scheduler drops or delays cron under load,
  # and a single daily fire meant 44 days of silent zero-output (May 20 - Jul 3).
  # Three attempts a day makes a dropped fire a non-event.
  #
  # Safe to fire repeatedly: scripts/daily-blog.py::already_posted_today()
  # exits cleanly if a post carrying today's date already exists, so at most
  # ONE post lands per day no matter how many times this runs.
  #
  # All times are UTC and deliberately inside the SAME UTC day, so the
  # already-posted guard sees a consistent date across all three fires.
  schedule:
    - cron: '0 15 * * *'   # 08:00 PDT
    - cron: '0 18 * * *'   # 11:00 PDT
    - cron: '0 21 * * *'   # 14:00 PDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth google-api-python-client

      - name: Generate blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
        run: python scripts/daily-blog.py

      - name: Commit and push
        run: |
          git config user.name "gina-blog-bot"
          git config user.email "bot@thereadyconsult.com"
          git add content/blog/
          if git diff --cached --quiet; then
            echo "No new blog post to commit."
            exit 0
          fi
          SLUG=$(git diff --cached --name-only -- content/blog/ | head -1 | sed 's|content/blog/||; s|\.md$||')
          git commit -m "add: daily blog post ${SLUG}"
          git push
